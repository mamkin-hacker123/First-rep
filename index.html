<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Бургер-меню</title>
  <style>
    /* Сброс стилей */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
    }

    /* Контейнер хедера */
    header {
      background: #333;
      color: white;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .burger {
      cursor: pointer;
      width: 30px;
      height: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .burger span {
      display: block;
      height: 3px;
      background: white;
      border-radius: 2px;
      transition: 0.3s;
    }

    /* Меню */
    nav {
      position: fixed;
      top: 0;
      right: -100%;
      width: 200px;
      height: 100vh;
      background: #444;
      padding: 2rem;
      transition: right 0.3s ease;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    nav a {
      color: white;
      text-decoration: none;

      &:hover {
        text-decoration: underline;
      }
    }

    /* Активное меню */
    nav.active {
      right: 0;
    }

    nav.hid {
        right: -100%;
    }
  </style>
</head>
<body>

  <header>
    <h1>Мой сайт</h1>
    <div class="burger" id="burger">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </header>

  <nav id="menu">
    <a href="#">Главная</a>
    <a href="#">О нас</a>
    <a href="#">Контакты</a>
  </nav>

  <script>
    const burger = document.getElementById('burger');
    const menu = document.getElementById('menu');

    burger.addEventListener('click', () => {
      menu.classList.toggle('active');
    });

    window.addEventListener('click', (event) => {
        if(event.target !== burger) return;

        menu.classList.add('hid');
    })
  </script>

</body>
</html>
